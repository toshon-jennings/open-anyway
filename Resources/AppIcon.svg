<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="0.55" stop-color="#5B3BEE"/>
      <stop offset="1" stop-color="#3A1FC4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Big Sur proportions: 824x824 squircle centred in a 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#sheen)"/>

  <!-- Shackle: hinged on the right, free end hanging left of the body. The gap
       is what reads as "open" at 16px, so it stays generous. -->
  <path d="M 632 566 L 632 430 A 120 120 0 0 0 392 430 L 392 496"
        fill="none" stroke="#FFFFFF" stroke-width="74" stroke-linecap="round"/>

  <!-- Body, with the keyhole knocked out so the gradient shows through. -->
  <path fill-rule="evenodd" fill="#FFFFFF" d="
    M 378 556 H 646 A 60 60 0 0 1 706 616 V 800 A 60 60 0 0 1 646 860
    H 378 A 60 60 0 0 1 318 800 V 616 A 60 60 0 0 1 378 556 Z
    M 512 652 A 38 38 0 0 0 490 721 L 478 792 H 546 L 534 721
    A 38 38 0 0 0 512 652 Z"/>
</svg>
